name: Build PowerPoint slides
on:
  push:
    branches: [main]
    paths:
      - 'presentation/build_slides.py'
      - '.github/workflows/presentation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PowerPoint generator
        run: python -m pip install python-pptx==1.0.2
      - name: Generate Office 2016 compatible presentation
        run: python presentation/build_slides.py
      - name: Verify slide count and PPTX
        run: |
          python - <<'PY'
          from pptx import Presentation
          p = Presentation("presentation/kafka_share_groups_office2016.pptx")
          assert len(p.slides) == 12, f"Expected 12 slides, found {len(p.slides)}"
          print("PPTX validated:", len(p.slides), "slides")
          PY
      - name: Commit presentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add presentation/kafka_share_groups_office2016.pptx
          if git diff --cached --quiet; then
            echo "Presentation is already up to date."
          else
            git commit -m "docs: publish regenerated Kafka PowerPoint slides"
            git push origin HEAD:main
          fi
