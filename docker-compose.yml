services:
  kafka:
    image: apache/kafka:4.2.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Mandatory for share groups on a one-broker local Kafka cluster:
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  share-slow:
    build: .
    profiles: [share]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      POC_ROLE: consumer
      POC_MODE: share
      POC_WORKER_ID: share-slow
      POC_DELAY_MS: ${SLOW_MS:-20000}
      POC_AUTO_RENEW_LOCKS: ${RENEW_LOCKS:-false}

  share-fast:
    build: .
    profiles: [share]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      POC_ROLE: consumer
      POC_MODE: share
      POC_WORKER_ID: share-fast
      POC_DELAY_MS: ${FAST_MS:-100}
      POC_AUTO_RENEW_LOCKS: ${RENEW_LOCKS:-false}

  classic-slow:
    build: .
    profiles: [classic]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      POC_ROLE: consumer
      POC_MODE: classic
      POC_WORKER_ID: classic-slow
      POC_DELAY_MS: ${SLOW_MS:-20000}

  classic-fast:
    build: .
    profiles: [classic]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      POC_ROLE: consumer
      POC_MODE: classic
      POC_WORKER_ID: classic-fast
      POC_DELAY_MS: ${FAST_MS:-100}

  publisher:
    build: .
    profiles: [tools]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      POC_ROLE: publisher
      POC_MODE: ${POC_MODE:-share}
      POC_START: ${POC_START:-0}
      POC_COUNT: ${POC_COUNT:-20}
